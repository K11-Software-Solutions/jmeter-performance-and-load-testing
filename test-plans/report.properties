# Settings for JMeter's HTML dashboard report. Pass with:  -q test-plans/report.properties
# Apdex: "satisfied" if response time <= 500 ms, "tolerated" up to 1500 ms, "frustrated" above.
jmeter.reportgenerator.apdex_satisfied_threshold=500
jmeter.reportgenerator.apdex_tolerated_threshold=1500
jmeter.reportgenerator.report_title=K11 Claims Summary performance test
# Graph granularity in ms (one point per 5 s for short runs; use 60000 for long runs).
jmeter.reportgenerator.overall_granularity=5000
# Leave Transaction Controller samples out of the "Top 5 errors by sampler" table.
jmeter.reportgenerator.exclude_tc_from_top5_errors_by_sampler=true
# Save the fields the report needs in the .jtl results file.
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.response_message=true
jmeter.save.saveservice.assertion_results_failure_message=true
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.connect_time=true
