# SOAK (endurance): normal load for a long time to find memory leaks and resource exhaustion.
# Real soak tests run for hours (4-24 h). Watch server memory, connections and disk over time.
# Tip: start the mock with LEAK=1 to see what a leak looks like in /metrics.
users=20
rampup=60
duration=14400
actions_per_session=4
think_min_ms=3000
think_range_ms=5000
